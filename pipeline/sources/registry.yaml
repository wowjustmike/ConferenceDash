# Declared event sources. Each URL was probed (robots.txt allows ConferenceDashBot, page reachable) on 2026-11-15.
# Page entries use the cascade JSON-LD -> iCal link -> LLM extraction. See docs/SOURCING.md for rejected sources.
sources:
  - id: lvcva-events
    kind: page
    type: jsonld
    url: https://www.lvcva.com/events
    city: Las Vegas
    state: NV
  - id: lacc
    kind: page
    type: html
    url: https://www.laconventioncenter.com/events/
    # Consumer/private bookings that are not conferences or trade shows (manual list; revisit when category data is available).
    exclude: [party, cheer, futsal, conversation, holiday, graduation, quincea, wedding, gala]
    venue: Los Angeles Convention Center
    city: Los Angeles
    state: CA
  - id: occc
    kind: page
    type: jsonld
    url: https://www.occc.net/events/
    venue: Orange County Convention Center
    city: Orlando
    state: FL
  - id: mccormick-place
    kind: datatable
    type: html
    url: https://www.mccormickplace.com/events/
    venue: McCormick Place
    city: Chicago
    state: IL
  - id: austin-cc
    kind: page
    type: jsonld
    url: https://www.austinconventioncenter.com/events
    venue: Austin Convention Center
    city: Austin
    state: TX
  - id: moscone
    kind: page
    type: jsonld
    url: https://www.moscone.com/events
    venue: Moscone Center
    city: San Francisco
    state: CA
  - id: vegas-convention-calendar
    kind: simpleview
    type: html
    url: https://www.vegasmeansbusiness.com/destination-calendar/
    city: Las Vegas
    state: NV
    end_date: '2027-12-31'
  - id: expoassist-us
    kind: expoassist
    type: aggregator
    url: https://expoassist.net/events/country/united-states-of-america
    max_pages: 12
