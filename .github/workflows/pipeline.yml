name: Pipeline

on:
  schedule:
    - cron: '0 9 * * *'    # daily tier
    - cron: '0 10 * * 0'   # weekly tier (Sunday)
    - cron: '0 11 1 * *'   # monthly tier (1st)
  workflow_dispatch:
    inputs:
      tier:
        description: Verification tier
        type: choice
        options: [daily, weekly, monthly]
        default: daily

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (web schema is shared with the pipeline)
        run: |
          npm ci --prefix web
          npm ci --prefix pipeline
      - name: Test
        run: npm test --prefix pipeline
      - name: Pick tier
        id: tier
        run: |
          case "${{ github.event.schedule }}" in
            "0 10 * * 0") t=weekly ;;
            "0 11 1 * *") t=monthly ;;
            "") t="${{ inputs.tier }}" ;;
            *) t=daily ;;
          esac
          echo "tier=${t:-daily}" >> "$GITHUB_OUTPUT"
      - name: Run pipeline
        run: npm run pipeline --prefix pipeline -- --tier "${{ steps.tier.outputs.tier }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: pipeline/out/
          if-no-files-found: ignore
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/events.json; then
            echo "No data changes."
          else
            git config user.name "conferencedash-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/events.json
            git commit -m "data: refresh ${{ steps.tier.outputs.tier }}"
            git push
          fi
