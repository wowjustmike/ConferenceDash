name: Pipeline

# The SQLite database (data/conferencedash.db) is the source of truth and is committed, so each run persists its state
# (exclusions, observations, aliases, topic overrides) for the next one. Local sessions must `git pull` before `npm run update`.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Verification tier
        type: choice
        options: [daily, weekly, monthly]
        default: daily
  schedule:
    - cron: '0 9 * * *'    # daily tier
    - cron: '0 10 * * 0'   # weekly tier (Sunday)
    - cron: '0 11 1 * *'   # monthly tier (1st)

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (web schema is shared with the pipeline)
        run: |
          npm ci --prefix web
          npm ci --prefix pipeline
      - name: Test
        run: npm test --prefix pipeline
      - name: Pick tier
        id: tier
        run: |
          t="${{ inputs.tier }}"
          case "${{ github.event.schedule }}" in
            '0 10 * * 0') tier=weekly ;;
            '0 11 1 * *') tier=monthly ;;
            *) tier="${t:-daily}" ;;
          esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
      - name: Database must come from the checkout
        run: test -s data/conferencedash.db
      - name: Run pipeline
        run: npm run pipeline --prefix pipeline -- --tier "${{ steps.tier.outputs.tier }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: pipeline/out/
          if-no-files-found: ignore
      - name: Commit refreshed data
        run: |
          rm -f data/conferencedash.db-wal data/conferencedash.db-shm
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git config user.name "conferencedash-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "data: refresh ${{ steps.tier.outputs.tier }}"
            git push
          fi
